  <!-- Classified Stamp -->
  <rect x="175" y="270" width="190" height="28" rx="3" fill="#111113" stroke="#d91b24" stroke-width="2" />
  <text x="270" y="288" fill="#d91b24" font-family="'Special Elite', monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">
    [ CONFIDENTIAL · HERO SLOT ]
  </text>
