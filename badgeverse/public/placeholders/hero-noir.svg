      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="70%" stop-color="#111113" />
      <stop offset="100%" stop-color="#070708" />
    </radialGradient>
  </defs>
  <rect width="540" height="340" fill="url(#noirGlow)" />
  <!-- Vault Door Geometric Circles & Spokes -->
  <g stroke="#d91b24" stroke-width="1.5" opacity="0.3" fill="none">
    <circle cx="270" cy="170" r="140" stroke-dasharray="8 6" />
    <circle cx="270" cy="170" r="110" />
    <circle cx="270" cy="170" r="80" stroke-dasharray="4 4" />
    <circle cx="270" cy="170" r="45" stroke-width="2.5" />
    <!-- Crosshairs & Teeth -->
    <line x1="130" y1="170" x2="410" y2="170" />
    <line x1="270" y1="30" x2="270" y2="310" />
    <line x1="171" y1="71" x2="369" y2="269" stroke-dasharray="6 6" />
    <line x1="171" y1="269" x2="369" y2="71" stroke-dasharray="6 6" />
  </g>
  <!-- Venetian Blind Slits -->
  <g fill="#000000" opacity="0.45">
    <rect x="0" y="40" width="540" height="14" />
    <rect x="0" y="80" width="540" height="14" />
    <rect x="0" y="120" width="540" height="14" />
    <rect x="0" y="160" width="540" height="14" />
    <rect x="0" y="200" width="540" height="14" />
    <rect x="0" y="240" width="540" height="14" />
