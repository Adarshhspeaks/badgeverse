<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#006466" />
      <stop offset="45%" stop-color="#2a9d8f" />
      <stop offset="80%" stop-color="#e9c46a" />
      <stop offset="100%" stop-color="#e74c3c" />
    </linearGradient>
  </defs>
  <rect width="540" height="340" fill="#fdf6e2" />
  <!-- Radiating Sunburst in upper center -->
  <g fill="url(#skyGrad)" opacity="0.85">
    <circle cx="270" cy="180" r="110" />
  </g>
  <!-- Radiating Rays -->
  <g stroke="#fdf6e2" stroke-width="4" opacity="0.6">
    <line x1="270" y1="180" x2="110" y2="60" />
    <line x1="270" y1="180" x2="170" y2="30" />
    <line x1="270" y1="180" x2="270" y2="10" />
    <line x1="270" y1="180" x2="370" y2="30" />
    <line x1="270" y1="180" x2="430" y2="60" />
  </g>
  <!-- Flight Curve Line -->
  <path d="M40 260 Q 240 80 490 140" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="6 6" />
  <!-- Vintage Route Waypoints -->
  <circle cx="40" cy="260" r="6" fill="#006466" />
  <circle cx="490" cy="140" r="6" fill="#e74c3c" />
  <!-- Bottom Sea / Horizon base -->
  <rect x="0" y="240" width="540" height="100" fill="#006466" opacity="0.95" />
  <!-- Label -->
  <rect x="160" y="270" width="220" height="28" rx="4" fill="#fdf6e2" stroke="#e74c3c" stroke-width="2" />
  <text x="270" y="288" fill="#e74c3c" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">
    ✈ REPLACE ME · VOYAGE HERO
  </text>
</svg>

